<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Name - Modern Landing Page</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1f2328;
            --accent-color: #0969da;
            --card-bg: #f6f8fa;
            --border-color: #d0d7de;
        }

        [data-theme="dark"] {
            --bg-color: #0d1117;
            --text-color: #e6edf3;
            --accent-color: #2f81f7;
            --card-bg: #161b22;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        header {
            max-width: 900px;
            margin: 40px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .theme-toggle:hover {
            background-color: var(--card-bg);
        }

        main {
            max-width: 900px;
            margin: 0 auto;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s forwards;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }

        .hero p {
            font-size: 1.25rem;
            color: #57606a;
            margin-bottom: 24px;
        }

        [data-theme="dark"] .hero p {
            color: #8b949e;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 8px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s 0.2s forwards;
        }

        .card h3 {
            margin-bottom: 8px;
        }

        footer {
            max-width: 900px;
            margin: 80px auto 20px auto;
            text-align: center;
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" style="font-weight: bold; font-size: 1.2rem;">🚀 ProjectDocs</div>
        <button class="theme-toggle" id="themeToggle">Toggle Dark Mode</button>
    </header>

    <main>
        <section class="hero">
            <h1>Start</h1>
            <p>Starting page</p>
            <a href="https://github.com/gamesholplays/DoubletapReply" class="btn" target="_blank">View on GitHub</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 @game_sholplays.</p>
    </footer>

    <script>
        // DOM Elements
        const themeToggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme');

        // Check for saved theme preference, otherwise use system preference
        if (currentTheme) {
            document.documentElement.setAttribute('data-theme', currentTheme);
            updateToggleButton(currentTheme);
        } else {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const defaultTheme = prefersDark ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', defaultTheme);
            updateToggleButton(defaultTheme);
        }

        // Handle toggle button click
        themeToggleBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            let newTheme = theme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateToggleButton(newTheme);
        });

        function updateToggleButton(theme) {
            themeToggleBtn.textContent = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
        }
    </script>
</body>
</html>
